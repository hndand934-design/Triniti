<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TRINITI — RPS</title>

  <link rel="stylesheet" href="./style.css" />
  <script src="../shared/wallet.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>

<div class="app">

  <header class="topbar">
    <a class="backBtn" href="../index.html">←</a>

    <div class="brand">
      <b>Triniti</b>
      <span>RPS</span>
    </div>

    <div class="topRight">
      <button id="soundBtn" class="pill">
        <span class="dot"></span>
        <span id="soundText">on</span>
      </button>
      <div class="pill">🪙 <b id="balance">0</b></div>
    </div>
  </header>

  <main class="game">

    <!-- СТАТЫ -->
    <div class="stats">
      <div id="statusView">Ожидание</div>
      <div id="seriesView">0</div>
      <div id="multView">x1.00</div>
      <div id="potentialView">0</div>
    </div>

    <!-- VS -->
    <div class="vs">
      <div class="card">
        <div id="botIcon">✊🏻</div>
      </div>

      <div class="vsMid">VS</div>

      <div class="card">
        <div id="youIcon">✊🏻</div>
      </div>
    </div>

    <!-- РЕЗУЛЬТАТ -->
    <div class="result">
      <div id="youPickView">—</div>
      <div id="botPickView">—</div>
      <div id="resultView">—</div>
    </div>

    <!-- ВЫБОР -->
    <div class="picks">
      <button class="pickBtn active" data-move="rock">✊🏻</button>
      <button class="pickBtn" data-move="scissors">✌🏻</button>
      <button class="pickBtn" data-move="paper">✋🏻</button>
    </div>

    <!-- ЛЕСТНИЦА -->
    <div id="ladder" class="ladder"></div>

    <!-- СТАВКА -->
    <div class="bet">
      <button id="betMinus">−</button>
      <input id="betInput" type="number" value="100">
      <button id="betPlus">+</button>
    </div>

    <!-- КНОПКИ -->
    <div class="actions">
      <button id="playBtn" class="play">Играть</button>
      <button id="cashoutBtn" disabled>Забрать</button>
    </div>

    <!-- ВЫИГРЫШ -->
    <div class="win">
      <span>Выигрыш</span>
      <b id="winView">0</b>
    </div>

  </main>
</div>

</body>
</html>
