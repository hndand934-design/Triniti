<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>TRINITI — Dragon Tower</title>

  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="./style.css">

  <script src="../shared/wallet.js" defer></script>
  <script src="./app.js" defer></script>
</head>

<body>
<div class="bg"></div>

<div class="app">

  <!-- TOP -->
  <header class="topbar">
    <div class="topbar__left">

      <a href="../index.html" class="backBtn">←</a>

      <div class="brandRow">
        <div class="brandLogo">
          <!-- твой логотип -->
          <svg viewBox="0 0 64 64">
            <defs>
              <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#f8e8b2"/>
                <stop offset="50%" stop-color="#e0c26f"/>
                <stop offset="100%" stop-color="#b78f46"/>
              </linearGradient>
            </defs>
            <rect x="10" y="10" width="44" height="44" rx="14"
                  fill="rgba(255,255,255,.04)"
                  stroke="url(#gold)" stroke-width="2"/>
            <path d="M21 20H43L39.5 25H34V41L32 45L30 41V25H24.5L21 20Z"
                  fill="url(#gold)"/>
          </svg>
        </div>

        <div>
          <div class="title">Triniti</div>
          <div class="subtitle">DRAGON TOWER</div>
        </div>
      </div>
    </div>

    <div class="topbar__right">
      <button id="soundBtn" class="pill">
        <span class="dot"></span>
        <span id="soundText">Звук</span>
      </button>

      <div class="pill pill--balance">🪙 <b id="balance">0</b></div>
    </div>
  </header>


  <!-- MAIN -->
  <main class="layout">

    <!-- LEFT CONTROL -->
    <aside class="panel">

      <div class="block">
        <div class="label">Режим</div>
        <div class="modeRow">
          <button id="modeNormal" class="seg active">Обычный</button>
          <button id="modeHard" class="seg">Сложный</button>
        </div>
      </div>

      <div class="block">
        <div class="label">Ставка</div>

        <div class="betRow">
          <button id="betMinus">−</button>
          <input id="betInput" value="100">
          <button id="betPlus">+</button>
        </div>

        <div class="chips">
          <button class="chip" data-bet="10">10</button>
          <button class="chip" data-bet="50">50</button>
          <button class="chip" data-bet="100">100</button>
          <button class="chip" data-bet="250">250</button>
          <button class="chip" data-bet="500">500</button>
          <button class="chip" data-bet="max">MAX</button>
        </div>

        <div class="actions">
          <button id="startBtn" class="btnPrimary">Играть</button>
          <button id="cashoutBtn" class="btnGhost" disabled>Забрать</button>
        </div>
      </div>

      <div class="block stats">
        <div>
          <div class="sLabel">Статус</div>
          <div id="statusText">Ожидание</div>
        </div>

        <div>
          <div class="sLabel">X</div>
          <div id="xText">x1.00</div>
        </div>

        <div>
          <div class="sLabel">Профит</div>
          <div id="potentialText">0</div>
        </div>
      </div>

    </aside>


    <!-- CENTER GAME -->
    <section class="game">

      <div id="towerGrid" class="towerGrid"></div>

    </section>


    <!-- RIGHT LADDER -->
    <aside class="panel">

      <div class="block">
        <div class="label">Лестница X</div>
        <div id="ladder" class="ladder"></div>
      </div>

    </aside>

  </main>
</div>
</body>
</html>
