<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>TRINITI — Dragon Tower</title>

  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="./style.css" />

  <script src="../shared/wallet.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="bg"></div>
  <div class="noise" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <div class="topbar__left">
        <a class="backBtn pressable" href="../index.html" aria-label="Назад">←</a>

        <div class="brandRow">
          <div class="brandLogo" aria-hidden="true">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="trinitiGoldTowerNew" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#f8e8b2"/>
                  <stop offset="48%" stop-color="#e0c26f"/>
                  <stop offset="100%" stop-color="#b78f46"/>
                </linearGradient>
              </defs>
              <rect x="10" y="10" width="44" height="44" rx="14"
                    fill="rgba(255,255,255,.04)"
                    stroke="url(#trinitiGoldTowerNew)"
                    stroke-width="2.2"/>
              <path d="M21 20H43L39.5 25H34V41L32 45L30 41V25H24.5L21 20Z"
                    fill="url(#trinitiGoldTowerNew)"/>
            </svg>
          </div>

          <div class="brandText">
            <div class="title">Triniti</div>
            <div id="subTitle" class="subtitle">DRAGON TOWER • единый кошелёк</div>
          </div>
        </div>
      </div>

      <div class="topbar__right">
        <button id="soundBtn" class="pill pressable" type="button" aria-label="Звук">
          <span class="dot"></span>
          <span id="soundText">Звук on</span>
        </button>

        <div class="pill pill--balance">🪙 <b id="balance">0</b></div>
      </div>
    </header>

    <main class="layout">
      <aside class="panel panel--control">
        <div class="sectionBlock">
          <div class="rowTitle">
            <div class="h2">Режим</div>
            <div id="difficultyTag" class="miniTag">Обычный</div>
          </div>

          <div class="modeRow" role="group" aria-label="mode">
            <button id="modeNormal" class="seg pressable active" type="button">Обычный</button>
            <button id="modeHard" class="seg pressable" type="button">Сложный</button>
          </div>

          <div id="modeHint" class="muted muted--spaced">Обычный: 3 яйца / 1 череп.</div>
        </div>

        <div class="sectionBlock">
          <div class="rowTitle">
            <div class="h2">Ставка</div>
            <div class="muted">общий кошелёк</div>
          </div>

          <div class="betRow">
            <button id="betMinus" class="btnSmall pressable" type="button">−</button>
            <input id="betInput" class="betInput" type="number" min="1" step="1" value="100" />
            <button id="betPlus" class="btnSmall pressable" type="button">+</button>
          </div>

          <div class="chips" role="group" aria-label="chips">
            <button class="chip pressable" data-bet="10" type="button">10</button>
            <button class="chip pressable" data-bet="50" type="button">50</button>
            <button class="chip pressable" data-bet="100" type="button">100</button>
            <button class="chip pressable" data-bet="250" type="button">250</button>
            <button class="chip pressable" data-bet="500" type="button">500</button>
            <button class="chip pressable" data-bet="max" type="button">MAX</button>
          </div>
        </div>

        <div class="sectionBlock sectionBlock--stats">
          <div class="compactStats">
            <div class="compactStat">
              <div class="label">Статус</div>
              <div id="statusText" class="value">Ожидание</div>
            </div>

            <div class="compactStat">
              <div class="label">Шаг</div>
              <div id="stepText" class="value">0</div>
            </div>

            <div class="compactStat">
              <div class="label">X</div>
              <div id="xText" class="value">x1.00</div>
            </div>

            <div class="compactStat">
              <div class="label">Потенциал</div>
              <div id="potentialText" class="value">0 🪙</div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="startBtn" class="btnPrimary pressable" type="button">Ставка</button>
          <button id="cashoutBtn" class="btnGhost pressable" type="button" disabled>Кэшаут</button>
        </div>
      </aside>

      <section class="boardCard">
        <div class="boardHead">
          <div>
            <div class="h1">Башня</div>
            <div class="hint">Выбирай плитку в активном ряду. Яйцо — победа ряда, череп — конец раунда.</div>
          </div>

          <div class="boardBadge">TRINITI</div>
        </div>

        <div id="towerGrid" class="towerGrid" aria-label="tower grid"></div>

        <div id="msg" class="msg">Выбери режим и ставку, затем нажми «Ставка».</div>
      </section>

      <aside class="panel panel--ladder">
        <div class="rowTitle">
          <div class="h2">Лестница X</div>
        </div>

        <div id="ladder" class="ladderGrid"></div>
      </aside>
    </main>
  </div>
</body>
</html>
